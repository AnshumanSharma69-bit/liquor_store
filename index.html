<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="theme-color" content="#08060a"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Spirits Finder"/>
  <link rel="manifest" href="/manifest.json"/>
  <link rel="apple-touch-icon" href="/icons/icon-192.png"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.6.0/dist/tabler-icons.min.css"/>
  <title>Spirits Finder</title>
  <style>
    :root {
      --bg:     #08060a;
      --s1:     #110810;
      --s2:     #180d17;
      --s3:     #201420;
      --border: rgba(255,255,255,0.07);
      --red:    #CC0000;
      --red2:   #FF2222;
      --red3:   #FF6666;
      --green:  #1DB87A;
      --blue:   #3B9EE8;
      --gold:   #F5A833;
      --pink:   #FF5C7A;
      --text:   #F2EEF2;
      --muted:  #7a6575;
      --muted2: #a090a0;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
      overscroll-behavior: none; -webkit-font-smoothing: antialiased;
    }

    /* ── Scanline overlay ── */
    body::before {
      content: ''; position: fixed; inset: 0; z-index: 9999; pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px, transparent 3px,
        rgba(0,0,0,0.035) 3px, rgba(0,0,0,0.035) 4px
      );
    }

    /* ── Noise grain ── */
    body::after {
      content: ''; position: fixed; inset: 0; z-index: 9998; pointer-events: none; opacity: 0.018;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 200px 200px;
    }

    #app {
      max-width: 430px; margin: 0 auto; min-height: 100dvh;
      background: var(--bg);
      background-image:
        radial-gradient(ellipse 130% 45% at 50% 0%,  rgba(160,0,0,0.14) 0%, transparent 60%),
        radial-gradient(ellipse 80%  50% at 0%  90%, rgba(100,0,0,0.09) 0%, transparent 55%);
      display: flex; flex-direction: column;
      position: relative;
    }

    /* ── Header ── */
    #header {
      padding: 52px 18px 16px;
      display: flex; align-items: center; gap: 14px;
      border-bottom: 1px solid rgba(180,0,0,0.12);
      position: relative;
    }
    #header::after {
      content: ''; position: absolute; bottom: 0; left: 18px; right: 18px; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(200,0,0,0.3), transparent);
    }
    .app-icon {
      width: 44px; height: 44px; flex-shrink: 0;
      background: var(--s2); border: 1px solid rgba(200,0,0,0.3);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    .app-icon i { font-size: 22px; color: var(--red2); }
    /* corner accents on icon */
    .app-icon::before, .app-icon::after {
      content: ''; position: absolute; width: 7px; height: 7px;
      border-color: var(--red); border-style: solid;
    }
    .app-icon::before { top: -1px; left: -1px; border-width: 1.5px 0 0 1.5px; border-radius: 3px 0 0 0; }
    .app-icon::after  { bottom: -1px; right: -1px; border-width: 0 1.5px 1.5px 0; border-radius: 0 0 3px 0; }

    #header-text h1 {
      font-size: 18px; font-weight: 700; color: var(--text);
      letter-spacing: 2px; text-transform: uppercase;
    }
    #header-text p {
      font-size: 9px; color: var(--red); letter-spacing: 3px;
      text-transform: uppercase; margin-top: 2px; opacity: 0.7;
    }
    #header-coords {
      margin-left: auto; text-align: right;
      font-size: 9px; color: var(--muted); letter-spacing: 0.5px;
      font-variant-numeric: tabular-nums; line-height: 1.6;
    }

    /* ── Install Banner ── */
    #install-banner {
      background: var(--s1); border: 1px solid rgba(124,111,224,0.2);
      border-radius: 14px; margin: 10px 14px 0;
      padding: 12px 14px; display: none; align-items: center; gap: 10px;
    }
    #install-banner i { font-size: 20px; color: #8B7FFF; flex-shrink: 0; }
    #install-banner p { font-size: 11px; color: #AFA9EC; flex: 1; line-height: 1.4; }
    #install-btn  { background: #534AB7; border: none; border-radius: 8px; padding: 6px 12px; color: #fff; font-size: 11px; font-weight: 600; cursor: pointer; }
    #close-banner { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 15px; }

    /* ── Radius Row ── */
    #radius-row {
      display: flex; align-items: center; gap: 10px;
      margin: 10px 14px 0; padding: 8px 12px;
      background: var(--s1); border: 1px solid var(--border); border-radius: 12px;
    }
    #radius-label { font-size: 9px; color: var(--red); letter-spacing: 2px; text-transform: uppercase; white-space: nowrap; }
    #radius-pills { display: flex; gap: 4px; flex: 1; }
    .rpill {
      flex: 1; background: transparent; border: 1px solid var(--border);
      border-radius: 7px; padding: 6px 0; font-size: 11px; font-weight: 500;
      color: var(--muted); cursor: pointer; text-align: center;
      transition: all 0.15s; font-family: inherit;
    }
    .rpill.active { background: rgba(200,0,0,0.12); border-color: rgba(200,0,0,0.4); color: var(--red2); }

    /* ── Store Card ── */
    #store-card {
      margin: 10px 14px 0;
      background: var(--s1); border: 1px solid var(--border);
      border-radius: 20px; overflow: hidden;
      position: relative;
    }
    /* Corner bracket decorations */
    .corner { position: absolute; width: 14px; height: 14px; z-index: 10; pointer-events: none; }
    .corner.tl { top: 6px; left: 6px; border-top: 1.5px solid rgba(200,0,0,0.4); border-left: 1.5px solid rgba(200,0,0,0.4); border-radius: 4px 0 0 0; }
    .corner.tr { top: 6px; right: 6px; border-top: 1.5px solid rgba(200,0,0,0.4); border-right: 1.5px solid rgba(200,0,0,0.4); border-radius: 0 4px 0 0; }
    .corner.bl { bottom: 6px; left: 6px; border-bottom: 1.5px solid rgba(200,0,0,0.4); border-left: 1.5px solid rgba(200,0,0,0.4); border-radius: 0 0 0 4px; }
    .corner.br { bottom: 6px; right: 6px; border-bottom: 1.5px solid rgba(200,0,0,0.4); border-right: 1.5px solid rgba(200,0,0,0.4); border-radius: 0 0 4px 0; }

    /* Photo */
    #store-photo-wrap {
      height: 185px; position: relative; background: var(--s2);
      display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    #store-photo { width:100%; height:100%; object-fit:cover; display:none; position:absolute; inset:0; z-index:1; }
    #photo-placeholder { display:flex; flex-direction:column; align-items:center; gap:8px; z-index:0; }
    #photo-placeholder i    { font-size:38px; color: var(--s3); }
    #photo-placeholder span { font-size:10px; color:#2a1a28; letter-spacing:1.5px; text-transform:uppercase; }

    @keyframes shimmer { 0%{background-position:-500px 0} 100%{background-position:500px 0} }
    .skeleton {
      background: linear-gradient(90deg, var(--s2) 25%, var(--s3) 50%, var(--s2) 75%);
      background-size: 500px 100%; animation: shimmer 1.4s infinite linear; border-radius: 8px;
    }
    #skel-photo { position:absolute; inset:0; z-index:2; display:none; border-radius:0; }
    #skel-photo.on { display:block; }

    /* Photo overlay */
    #photo-overlay {
      position:absolute; bottom:0; left:0; right:0; z-index:3;
      padding: 55px 14px 12px;
      background: linear-gradient(to top, rgba(8,6,10,1) 0%, rgba(8,6,10,0.8) 45%, transparent 100%);
    }
    #store-title {
      font-size: 17px; font-weight: 700; color: var(--text);
      letter-spacing: -0.3px; line-height: 1.25;
    }
    #store-meta { display:flex; align-items:center; gap:8px; margin-top:4px; min-height:16px; }
    #store-rating      { font-size:11px; color: var(--gold); }
    #store-hours-short { font-size:10px; }
    #skel-title { height:16px; width:62%; margin-bottom:7px; display:none; }
    #skel-title.on { display:block; }
    #skel-meta  { height:11px; width:38%; display:none; }
    #skel-meta.on  { display:block; }

    /* Open badge */
    #open-badge {
      position:absolute; top:10px; right:10px; z-index:4;
      border-radius:6px; padding:4px 10px; font-size:10px; font-weight:600;
      align-items:center; gap:5px; display:none; cursor:pointer; user-select:none;
      letter-spacing: 0.5px; text-transform: uppercase;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    }
    #open-badge.open   { background:rgba(10,35,22,0.9); color:var(--green); border:1px solid rgba(29,184,122,0.3); display:flex; }
    #open-badge.closed { background:rgba(35,10,16,0.9); color:var(--pink);  border:1px solid rgba(255,92,122,0.3); display:flex; }
    #open-badge .dot     { width:5px; height:5px; border-radius:50%; background:currentColor; flex-shrink:0; }
    #open-badge .chevron { font-size:10px; margin-left:1px; transition:transform 0.25s; }
    #open-badge.expanded .chevron { transform: rotate(180deg); }

    /* Hours */
    #hours-panel { max-height:0; overflow:hidden; transition: max-height 0.35s cubic-bezier(0.4,0,0.2,1); background:#07040a; border-top:1px solid transparent; }
    #hours-panel.open { max-height:280px; border-top-color: rgba(200,0,0,0.15); }
    #hours-list { padding:10px 14px 12px; display:flex; flex-direction:column; gap:6px; }
    .hour-row { display:flex; justify-content:space-between; font-size:11px; }
    .hour-row .day  { color: var(--muted); }
    .hour-row .time { color: var(--muted); text-align:right; }
    .hour-row.today .day  { color: var(--red2); font-weight:600; }
    .hour-row.today .time { color: var(--text); font-weight:500; }

    /* Action row */
    #action-row { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; padding:10px 13px 13px; }
    .action-btn {
      background: var(--s2); border:1px solid var(--border); border-radius:12px;
      padding:13px 6px; display:flex; flex-direction:column; align-items:center; gap:5px;
      cursor:pointer; text-decoration:none; transition: background 0.15s, transform 0.1s;
      font-family: inherit; position: relative; overflow: hidden;
    }
    .action-btn:hover  { background: var(--s3); }
    .action-btn:active { transform: scale(0.96); }
    .action-btn i    { font-size:22px; }
    .action-btn span { font-size:10px; font-weight:600; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
    .action-btn.call i { color: var(--green); }
    .action-btn.dir  i { color: #7C6FE0; }
    .action-btn.off    { opacity:0.25; pointer-events:none; }

    /* ── Status Bar ── */
    #status-bar {
      margin: 10px 14px 0;
      background: var(--s1); border: 1px solid var(--border); border-radius: 10px;
      padding: 9px 14px; display: flex; align-items: center; gap: 8px;
      font-size: 11px; letter-spacing: 0.3px;
    }
    #status-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #333; flex-shrink: 0; transition: background 0.4s;
    }
    #status-dot.active { background: var(--red2); animation: blink 1.4s ease-in-out infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
    #status-text { font-size: 11px; color: var(--muted); flex: 1; }
    #status-tag {
      font-size: 8px; letter-spacing: 1.5px; text-transform: uppercase;
      color: rgba(200,0,0,0.45); font-weight: 600;
    }

    /* ── Compass Area ── */
    #compass-area {
      display: flex; flex-direction: column; align-items: center;
      padding: 18px 20px 12px; gap: 16px; position: relative;
    }
    #compass-wrap {
      position: relative; width: 260px; height: 260px;
      display: flex; align-items: center; justify-content: center;
    }

    /* Slow rotating outer ring */
    #compass-ring-spin {
      position: absolute; inset: -10px; border-radius: 50%;
      border: 1px dashed rgba(160,0,0,0.22);
      animation: spin-slow 30s linear infinite;
      pointer-events: none;
    }
    #compass-ring-spin::before {
      content: ''; position: absolute;
      top: 50%; left: -4px; transform: translateY(-50%);
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--red); opacity: 0.7;
    }
    #compass-ring-spin::after {
      content: ''; position: absolute;
      bottom: -4px; left: 50%; transform: translateX(-50%);
      width: 4px; height: 4px; border-radius: 50%;
      background: rgba(200,0,0,0.4);
    }
    @keyframes spin-slow { to { transform: rotate(360deg); } }

    /* Second counter-spin ring */
    #compass-ring-counter {
      position: absolute; inset: -18px; border-radius: 50%;
      border: 1px solid transparent;
      border-top-color: rgba(200,0,0,0.1);
      border-right-color: rgba(200,0,0,0.06);
      animation: spin-slow 18s linear infinite reverse;
      pointer-events: none;
    }

    /* Active glow */
    #compass-glow {
      position: absolute; inset: -14px; border-radius: 50%;
      background: radial-gradient(circle, rgba(200,0,0,0.07) 0%, transparent 65%);
      opacity: 0; transition: opacity 0.7s;
    }
    #compass-wrap.active #compass-glow { opacity: 1; }

    @keyframes pulse-ring { 0%{transform:scale(1);opacity:0.35} 100%{transform:scale(1.1);opacity:0} }
    #pulse-ring {
      position: absolute; inset: 0; border-radius: 50%;
      border: 1.5px solid rgba(200,0,0,0.25); opacity: 0; pointer-events: none;
    }
    #compass-wrap.active #pulse-ring { animation: pulse-ring 2.5s ease-out infinite; }

    #compass-svg   { width: 260px; height: 260px; }
    #needle-group  { transform-origin: 130px 130px; transition: transform 0.45s cubic-bezier(0.34,1.4,0.64,1); }
    #bearing-arrow { transform-origin: 130px 130px; transition: transform 0.45s cubic-bezier(0.34,1.4,0.64,1); }

    /* ── Distance Display ── */
    #dist-row {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
    }
    #dist-label {
      font-size: 8px; letter-spacing: 3px; text-transform: uppercase;
      color: rgba(200,0,0,0.5); font-weight: 600;
    }
    #dist-pill {
      background: var(--s1); border: 1px solid rgba(200,0,0,0.25);
      border-radius: 10px; padding: 9px 28px;
      display: flex; align-items: baseline; gap: 5px;
      position: relative; overflow: hidden;
    }
    /* Scan line effect on distance pill */
    #dist-pill::after {
      content: ''; position: absolute;
      top: 0; bottom: 0; left: -60%;
      width: 50%;
      background: linear-gradient(90deg, transparent, rgba(200,0,0,0.06), transparent);
      animation: scan 3s ease-in-out infinite;
    }
    @keyframes scan { 0%{left:-60%} 100%{left:110%} }
    #dist-val  { font-size: 32px; font-weight: 800; color: var(--red2); font-variant-numeric: tabular-nums; letter-spacing: -1.5px; }
    #dist-unit { font-size: 12px; color: var(--muted2); }

    /* ── Info Grid ── */
    #info-grid {
      display: grid; grid-template-columns: repeat(3,1fr);
      gap: 6px; padding: 0 14px 8px; width: 100%;
    }
    .ic {
      background: var(--s1); border: 1px solid var(--border);
      border-radius: 12px; padding: 11px 10px;
      display: flex; flex-direction: column; gap: 4px;
      position: relative; overflow: hidden;
    }
    .ic::before {
      content: ''; position: absolute;
      top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(200,0,0,0.2), transparent);
    }
    .ic i    { font-size: 16px; }
    .ic.bear i { color: #7C6FE0; }
    .ic.walk i { color: var(--green); }
    .ic.rate i { color: var(--gold); }
    .ic .lbl { font-size: 8px; color: var(--muted); margin-top: 1px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; }
    .ic .val { font-size: 15px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }

    /* ── Minimap ── */
    #minimap-section {
      display: flex; flex-direction: column; align-items: center;
      padding: 0 14px 8px; gap: 5px;
    }
    #minimap-label {
      font-size: 8px; font-weight: 700; letter-spacing: 3px;
      color: rgba(180,0,0,0.45); text-transform: uppercase;
    }
    #minimap-wrap { position: relative; width: 150px; height: 150px; }
    #minimap-wrap::before {
      content: ''; position: absolute; inset: -3px; border-radius: 50%;
      background: conic-gradient(from 0deg, rgba(160,0,0,0.5), rgba(40,0,0,0.1), rgba(160,0,0,0.5));
      z-index: 0;
    }
    #minimap-wrap::after {
      content: ''; position: absolute; inset: -1px; border-radius: 50%;
      background: var(--bg); z-index: 1; transform: scale(0.97);
    }
    #minimap { display: block; border-radius: 50%; position: relative; z-index: 2; }

    /* ── Store List ── */
    #list-toggle {
      margin: 0 14px 6px; background: none; border: 1px solid var(--border);
      border-radius: 10px; padding: 8px 14px; color: var(--muted);
      font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase;
      cursor: pointer; width: calc(100% - 28px); display: none;
      align-items: center; justify-content: center; gap: 7px; font-family: inherit;
      transition: background 0.15s;
    }
    #list-toggle:hover { background: var(--s1); }
    #store-list { display:none; flex-direction:column; gap:5px; margin:0 14px 8px; max-height:190px; overflow-y:auto; }
    .sl-item {
      background: var(--s1); border: 1px solid var(--border); border-radius: 12px;
      padding: 9px 12px; display: flex; align-items: center; gap: 10px;
      cursor: pointer; transition: border-color 0.15s, background 0.15s;
    }
    .sl-item:hover  { background: var(--s2); }
    .sl-item.active { border-color: rgba(200,0,0,0.4); background: rgba(150,0,0,0.07); }
    .sl-num  { font-size: 9px; font-weight: 700; color: var(--red2); width: 18px; text-align: center; flex-shrink: 0; letter-spacing: 0.5px; }
    .sl-name { font-size: 12px; font-weight: 500; color: var(--text); }
    .sl-meta { font-size: 10px; color: var(--muted); margin-top: 2px; }
    .sl-badge { margin-left:auto; border-radius:5px; padding:2px 7px; font-size:9px; font-weight:700; flex-shrink:0; letter-spacing:0.5px; text-transform:uppercase; }
    .sl-badge.open   { background:rgba(10,35,22,0.8); color:var(--green); }
    .sl-badge.closed { background:rgba(35,10,16,0.8); color:var(--pink); }

    #err-box {
      margin:0 14px 8px; background:rgba(25,5,15,0.9); border:1px solid rgba(80,20,40,0.6);
      border-radius:10px; padding:9px 13px; font-size:11px; color:#d88aa8;
      display:none; line-height:1.5; letter-spacing:0.2px;
    }

    /* ── Locate Button ── */
    #locate-btn {
      margin: 0 14px 30px; width: calc(100% - 28px);
      background: linear-gradient(135deg, #CC0000 0%, #6A0000 100%);
      border: none; border-radius: 14px; padding: 16px;
      color: #fff; font-size: 14px; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 9px;
      letter-spacing: 2px; text-transform: uppercase; font-family: inherit;
      position: relative; overflow: hidden;
      transition: opacity 0.2s, transform 0.1s;
    }
    /* Shimmer scan on button */
    #locate-btn::before {
      content: ''; position: absolute; top: 0; bottom: 0; left: -80%;
      width: 60%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
      animation: btn-scan 2.8s ease-in-out infinite;
    }
    @keyframes btn-scan { 0%{left:-80%} 100%{left:120%} }
    #locate-btn:hover  { opacity: 0.88; }
    #locate-btn:active { transform: scale(0.98); }
    #locate-btn:disabled {
      background: var(--s2); color: var(--muted); cursor: not-allowed;
      letter-spacing: 1px;
    }
    #locate-btn:disabled::before { display: none; }
    #locate-btn i { font-size: 18px; }

    #store-list::-webkit-scrollbar { width: 3px; }
    #store-list::-webkit-scrollbar-thumb { background: var(--s3); border-radius: 10px; }
  </style>
</head>
<body>
<div id="app">

  <div id="header">
    <div class="app-icon"><i class="ti ti-bottle"></i></div>
    <div id="header-text">
      <h1>Spirits</h1>
      <p>Proximity Locator</p>
    </div>
    <div id="header-coords">
      <div id="hdr-lat">LAT —</div>
      <div id="hdr-lng">LNG —</div>
    </div>
  </div>

  <div id="install-banner">
    <i class="ti ti-download"></i>
    <p>Add to Home Screen for the full experience!</p>
    <button id="install-btn" onclick="installApp()">Install</button>
    <button id="close-banner" onclick="document.getElementById('install-banner').style.display='none'">✕</button>
  </div>

  <div id="radius-row">
    <span id="radius-label">Range</span>
    <div id="radius-pills">
      <button class="rpill"        data-r="1000"  onclick="setRadius(this)">1 km</button>
      <button class="rpill active" data-r="3000"  onclick="setRadius(this)">3 km</button>

<script>
  // Show coords in header when located
  const _origStart = startLocating;
  navigator.geolocation && (function(){
    const orig = window.startLocating;
    window.startLocating = function() {
      orig();
    };
  })();

  // Hook into geolocation to show coords
  const _origGet = navigator.geolocation.getCurrentPosition.bind(navigator.geolocation);
  navigator.geolocation.getCurrentPosition = function(success, err, opts) {
    _origGet(function(pos) {
      const lat = pos.coords.latitude, lng = pos.coords.longitude;
      document.getElementById('hdr-lat').textContent = 'LAT ' + lat.toFixed(4);
      document.getElementById('hdr-lng').textContent = 'LNG ' + lng.toFixed(4);
      document.getElementById('status-dot').classList.add('active');
      success(pos);
    }, err, opts);
  };
</script>
