<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="theme-color" content="#0c0b0f"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Spirits Finder"/>
  <meta name="description" content="Live compass to the nearest liquor store near you."/>
  <link rel="manifest" href="/manifest.json"/>
  <link rel="apple-touch-icon" href="/icons/icon-192.png"/>
  <link rel="icon" href="/icons/icon-192.png"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.6.0/dist/tabler-icons.min.css"/>
  <title>Spirits Finder</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; background: #0c0b0f; color: #f0eefc;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
      overscroll-behavior: none;
    }
    #app {
      max-width: 430px; margin: 0 auto;
      min-height: 100dvh; background: #0c0b0f;
      display: flex; flex-direction: column;
    }

    /* ── Header ── */
    #header {
      background: #161420; border-bottom: 0.5px solid #2a2638;
      padding: 52px 18px 14px;
      display: flex; align-items: center; gap: 12px;
    }
    .app-icon {
      width: 40px; height: 40px; background: #E05A28;
      border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .app-icon i { font-size: 22px; color: #fff; }
    #header h1 { font-size: 17px; font-weight: 600; color: #F0EDF8; letter-spacing: -0.3px; }
    #header p  { font-size: 11px; color: #6b6580; margin-top: 1px; }

    /* ── Install Banner ── */
    #install-banner {
      background: #161420; border: 0.5px solid #534AB7;
      border-radius: 16px; margin: 12px 12px 0;
      padding: 12px 14px; display: none;
      align-items: center; gap: 10px;
    }
    #install-banner i  { font-size: 22px; color: #8B7FFF; flex-shrink: 0; }
    #install-banner p  { font-size: 12px; color: #AFA9EC; flex: 1; line-height: 1.4; }
    #install-btn {
      background: #534AB7; border: none; border-radius: 8px;
      padding: 6px 12px; color: #fff; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;
    }
    #close-banner { background: none; border: none; color: #6b6580; cursor: pointer; font-size: 16px; padding: 4px; }

    /* ── Store Card ── */
    #store-card {
      margin: 12px 12px 0; background: #161420;
      border: 0.5px solid #2a2638; border-radius: 20px; overflow: hidden;
    }
    #store-photo-wrap {
      height: 148px; position: relative; background: #1a1728;
      display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    #store-photo { width: 100%; height: 100%; object-fit: cover; display: none; position: absolute; inset: 0; }
    #photo-placeholder { display: flex; flex-direction: column; align-items: center; gap: 6px; z-index: 1; }
    #photo-placeholder i    { font-size: 34px; color: #2a2638; }
    #photo-placeholder span { font-size: 11px; color: #3a3550; }
    .photo-gradient {
      position: absolute; inset: 0; z-index: 2;
      background: linear-gradient(to bottom, transparent 40%, #161420 100%);
      pointer-events: none;
    }
    #open-badge {
      position: absolute; top: 10px; right: 10px; z-index: 3;
      border-radius: 20px; padding: 4px 10px; font-size: 11px; font-weight: 600;
      align-items: center; gap: 5px; display: none;
    }
    #open-badge.open   { background: #0a2718; color: #22C77A; border: 0.5px solid #22C77A55; display: flex; }
    #open-badge.closed { background: #2a0e14; color: #FF5C7A; border: 0.5px solid #FF5C7A55; display: flex; }
    #open-badge .dot   { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

    #store-info { padding: 12px 14px 4px; }
    #store-title { font-size: 16px; font-weight: 600; color: #3a3550; letter-spacing: -0.3px; transition: color 0.3s; }
    #store-meta  { display: flex; align-items: center; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
    #store-rating      { font-size: 12px; color: #F5A833; }
    #store-hours-short { font-size: 11px; }

    #action-row {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 8px; padding: 10px 14px 14px;
    }
    .action-btn {
      background: #1e1b2a; border: 0.5px solid #2a2638;
      border-radius: 12px; padding: 10px 6px;
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      cursor: pointer; text-decoration: none; transition: background 0.15s, border-color 0.15s;
    }
    .action-btn:hover   { background: #252233; border-color: #3d3858; }
    .action-btn i       { font-size: 20px; }
    .action-btn span    { font-size: 10px; font-weight: 500; color: #7a748f; }
    .action-btn.call  i { color: #22C77A; }
    .action-btn.dir   i { color: #8B7FFF; }
    .action-btn.share i { color: #3B9EE8; }
    .action-btn.off     { opacity: 0.3; pointer-events: none; }
    button.action-btn   { border: 0.5px solid #2a2638; cursor: pointer; }

    /* ── Status ── */
    #status-bar {
      background: #161420; margin: 8px 12px 0;
      border-radius: 12px; border: 0.5px solid #2a2638;
      padding: 10px 14px; display: flex; align-items: center; gap: 8px;
    }
    #status-dot  { width: 7px; height: 7px; border-radius: 50%; background: #333; flex-shrink: 0; transition: background 0.4s; }
    #status-text { font-size: 12px; color: #6b6580; flex: 1; }

    /* ── Compass ── */
    #compass-area {
      display: flex; flex-direction: column; align-items: center;
      padding: 20px 20px 12px; gap: 16px;
    }
    #compass-wrap {
      position: relative; width: 210px; height: 210px;
      display: flex; align-items: center; justify-content: center;
    }
    #compass-glow {
      position: absolute; inset: -14px; border-radius: 50%;
      background: radial-gradient(circle, #22C77A0d 0%, transparent 65%);
      opacity: 0; transition: opacity 0.6s;
    }
    #compass-wrap.active #compass-glow { opacity: 1; }
    #compass-svg { width: 210px; height: 210px; }
    #needle-group  { transform-origin: 105px 105px; transition: transform 0.45s cubic-bezier(0.34,1.4,0.64,1); }
    #bearing-arrow { transform-origin: 105px 105px; transition: transform 0.45s cubic-bezier(0.34,1.4,0.64,1); }

    #dist-pill {
      background: #E05A28; border-radius: 40px;
      padding: 9px 22px; display: flex; align-items: baseline; gap: 6px;
    }
    #dist-val  { font-size: 26px; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; letter-spacing: -0.5px; }
    #dist-unit { font-size: 12px; color: #f5c4b3; }

    /* ── Info Grid ── */
    #info-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 6px; padding: 0 12px 8px; width: 100%;
    }
    .ic {
      background: #161420; border: 0.5px solid #2a2638;
      border-radius: 12px; padding: 10px 10px;
      display: flex; flex-direction: column; gap: 3px;
    }
    .ic i    { font-size: 16px; color: #8B7FFF; }
    .ic .lbl { font-size: 10px; color: #6b6580; margin-top: 1px; }
    .ic .val { font-size: 13px; font-weight: 600; color: #F0EDF8; font-variant-numeric: tabular-nums; }

    /* ── Store List ── */
    #list-toggle {
      margin: 0 12px 6px; background: none; border: 0.5px solid #2a2638;
      border-radius: 10px; padding: 8px 14px;
      color: #6b6580; font-size: 11px; cursor: pointer;
      width: calc(100% - 24px); display: none;
      align-items: center; justify-content: center; gap: 6px;
    }
    #list-toggle i { font-size: 13px; }
    #store-list {
      display: none; flex-direction: column; gap: 5px;
      margin: 0 12px 6px; max-height: 190px; overflow-y: auto;
    }
    .sl-item {
      background: #161420; border: 0.5px solid #2a2638;
      border-radius: 12px; padding: 9px 12px;
      display: flex; align-items: center; gap: 10px;
      cursor: pointer; transition: border-color 0.15s;
    }
    .sl-item:hover, .sl-item.active { border-color: #E05A28; }
    .sl-num  { font-size: 10px; font-weight: 700; color: #E05A28; width: 16px; text-align: center; flex-shrink: 0; }
    .sl-name { font-size: 12px; font-weight: 500; color: #F0EDF8; }
    .sl-meta { font-size: 10px; color: #6b6580; margin-top: 1px; }
    .sl-badge {
      margin-left: auto; border-radius: 6px; padding: 2px 7px;
      font-size: 10px; font-weight: 600; flex-shrink: 0;
    }
    .sl-badge.open   { background: #0a2718; color: #22C77A; }
    .sl-badge.closed { background: #2a0e14; color: #FF5C7A; }

    /* ── Locate Button ── */
    #locate-btn {
      margin: 0 12px 28px; width: calc(100% - 24px);
      background: #E05A28; border: none; border-radius: 14px;
      padding: 15px; color: #fff; font-size: 15px; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: background 0.2s; letter-spacing: -0.2px;
    }
    #locate-btn:hover    { background: #B84520; }
    #locate-btn:disabled { background: #3a1e12; color: #7a4030; cursor: not-allowed; }
    #locate-btn i { font-size: 17px; }

    #err-box {
      margin: 0 12px 8px; background: #1e0d16; border: 0.5px solid #5a2035;
      border-radius: 10px; padding: 9px 13px;
      font-size: 11px; color: #e89ab8; display: none; line-height: 1.4;
    }

    #store-list::-webkit-scrollbar { width: 3px; }
    #store-list::-webkit-scrollbar-thumb { background: #2a2638; border-radius: 10px; }
  </style>
</head>
<body>
<div id="app">

  <div id="header">
    <div class="app-icon"><i class="ti ti-bottle"></i></div>
    <div>
      <h1>Spirits Finder</h1>
      <p>Live compass · nearest liquor store</p>
    </div>
  </div>

  <div id="install-banner">
    <i class="ti ti-download"></i>
    <p>Add to Home Screen for the full app experience!</p>
    <button id="install-btn" onclick="installApp()">Install</button>
    <button id="close-banner" onclick="document.getElementById('install-banner').style.display='none'">✕</button>
  </div>

  <div id="store-card">
    <div id="store-photo-wrap">
      <div id="photo-placeholder">
        <i class="ti ti-building-store"></i>
        <span>Tap locate to find a store</span>
      </div>
      <img id="store-photo" alt="Store front"/>
      <div class="photo-gradient"></div>
      <div id="open-badge"><div class="dot"></div><span id="open-txt">Open</span></div>
    </div>
    <div id="store-info">
      <div id="store-title">— waiting for location —</div>
      <div id="store-meta">
        <span id="store-rating"></span>
        <span id="store-hours-short"></span>
      </div>
    </div>
    <div id="action-row">
      <a id="btn-call"    class="action-btn call  off" href="#"><i class="ti ti-phone"></i><span>Call</span></a>
      <a id="btn-dir"     class="action-btn dir   off" href="#" target="_blank"><i class="ti ti-map-2"></i><span>Directions</span></a>
      <button id="btn-share" class="action-btn share off" onclick="shareStore()"><i class="ti ti-share"></i><span>Share</span></button>
    </div>
  </div>

  <div id="status-bar">
    <div id="status-dot"></div>
    <span id="status-text">Tap locate to get started</span>
  </div>

  <div id="compass-area">
    <div id="compass-wrap">
      <div id="compass-glow"></div>
      <svg id="compass-svg" viewBox="0 0 210 210" xmlns="http://www.w3.org/2000/svg">
        <circle cx="105" cy="105" r="100" fill="#0c0b0f" stroke="#2a2638" stroke-width="1"/>
        <circle cx="105" cy="105" r="83"  fill="none"   stroke="#1a1728" stroke-width="0.5"/>
        <circle cx="105" cy="105" r="58"  fill="none"   stroke="#1a1728" stroke-width="0.5"/>
        <text x="105" y="16"  text-anchor="middle" font-size="12" font-weight="700" fill="#E05A28">N</text>
        <text x="105" y="202" text-anchor="middle" font-size="11" fill="#3a3558">S</text>
        <text x="12"  y="110" text-anchor="middle" font-size="11" fill="#3a3558">W</text>
        <text x="198" y="110" text-anchor="middle" font-size="11" fill="#3a3558">E</text>
        <line x1="105" y1="6"   x2="105" y2="18"  stroke="#E05A28" stroke-width="2"/>
        <line x1="105" y1="192" x2="105" y2="204" stroke="#2a2638" stroke-width="1"/>
        <line x1="6"   y1="105" x2="18"  y2="105" stroke="#2a2638" stroke-width="1"/>
        <line x1="192" y1="105" x2="204" y2="105" stroke="#2a2638" stroke-width="1"/>
        <line x1="149" y1="20"  x2="145" y2="28"  stroke="#2a2638" stroke-width="0.7"/>
        <line x1="190" y1="61"  x2="182" y2="65"  stroke="#2a2638" stroke-width="0.7"/>
        <line x1="190" y1="149" x2="182" y2="145" stroke="#2a2638" stroke-width="0.7"/>
        <line x1="149" y1="190" x2="145" y2="182" stroke="#2a2638" stroke-width="0.7"/>
        <line x1="61"  y1="190" x2="65"  y2="182" stroke="#2a2638" stroke-width="0.7"/>
        <line x1="20"  y1="149" x2="28"  y2="145" stroke="#2a2638" stroke-width="0.7"/>
        <line x1="20"  y1="61"  x2="28"  y2="65"  stroke="#2a2638" stroke-width="0.7"/>
        <line x1="61"  y1="20"  x2="65"  y2="28"  stroke="#2a2638" stroke-width="0.7"/>
        <g id="needle-group">
          <polygon points="105,20 110,105 105,116 100,105" fill="#E05A28"/>
          <polygon points="105,190 110,105 105,116 100,105" fill="#2a2638"/>
          <circle cx="105" cy="105" r="9"   fill="#0c0b0f" stroke="#2a2638" stroke-width="1.5"/>
          <circle cx="105" cy="105" r="3.5" fill="#E05A28"/>
        </g>
        <g id="bearing-arrow" style="display:none">
          <line x1="105" y1="105" x2="105" y2="28" stroke="#22C77A" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 3" opacity="0.4"/>
          <line x1="105" y1="105" x2="105" y2="50" stroke="#22C77A" stroke-width="2.5" stroke-linecap="round"/>
          <polygon points="105,20 110,35 105,30 100,35" fill="#22C77A"/>
          <circle cx="105" cy="105" r="5" fill="#22C77A"/>
        </g>
      </svg>
    </div>
    <div id="dist-pill">
      <span id="dist-val">—</span>
      <span id="dist-unit">km away</span>
    </div>
  </div>

  <div id="info-grid">
    <div class="ic"><i class="ti ti-compass"></i><div class="lbl">Bearing</div><div class="val" id="i-bearing">—°</div></div>
    <div class="ic"><i class="ti ti-walk"></i><div class="lbl">Walk time</div><div class="val" id="i-walk">—</div></div>
    <div class="ic"><i class="ti ti-star-filled" style="color:#F5A833"></i><div class="lbl">Rating</div><div class="val" id="i-rating">—</div></div>
  </div>

  <button id="list-toggle" onclick="toggleList()">
    <i class="ti ti-list"></i><span id="list-txt">Show nearby stores</span>
  </button>
  <div id="store-list"></div>
  <div id="err-box"></div>

  <button id="locate-btn" onclick="startLocating()">
    <i class="ti ti-current-location"></i> Locate Nearest Store
  </button>
  
</div>
<script src="/app.js"></script>
</body>
</html>
